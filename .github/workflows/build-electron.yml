name: Build Electron App

on:
  push:
    branches: [main, safe-publish]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package Electron App
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you have a certificate later, add secrets here:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Salle-des-Fetes-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });

            for (const name of fs.readdirSync("dist").filter((file) => file.endsWith(".exe"))) {
              const filePath = path.join("dist", name);
              const data = await fs.promises.readFile(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length,
                },
              });
            }

      - name: Remove pre-release installer from v1.1.0
        if: github.ref == 'refs/heads/safe-publish'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "v1.1.0",
            });
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            const staleAsset = assets.find(
              (asset) => asset.name === "Salle.des.Fetes.1.0.0.exe",
            );
            if (staleAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: staleAsset.id,
              });
            }
